server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A bare `types {}` block replaces nginx's whole default MIME table for
    # this context rather than extending it — include the real table first
    # so .js/.css/etc keep their correct types, then add wasm on top (not
    # all nginx builds' bundled mime.types include it, and without it the
    # browser may refuse to instantiate the file as a WebAssembly module).
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/json;
    gzip_min_length 1024;

    # Hashed asset filenames (Vite's build output) can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
